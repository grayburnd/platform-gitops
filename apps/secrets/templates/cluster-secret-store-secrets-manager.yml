apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.environment }}-clusterSecretStore_secrets_manager
  annotations:
    external-secrets.io/ignore-maintenance-checks: "true"
spec:
  provider:
    aws:
      service: {{ .Values.clusterSecretStore_secrets_manager.service }}
      role: {{ .Values.clusterSecretStore_secrets_manager.role }}
      region: {{ .Values.aws.region }}
        jwt:
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore_secrets_manager.serviceAccountRef.name }}
            namespace: {{ .Values.team }}-{{ .Values.environment }}
