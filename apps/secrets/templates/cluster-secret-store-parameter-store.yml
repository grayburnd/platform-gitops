apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.environment }}-clusterSecretStore_parameter_store
  annotations:
    external-secrets.io/ignore-maintenance-checks: "true"
spec:
  provider:
    aws:
      service: {{ .Values.clusterSecretStore_parameter_store.service }}
      role: {{ .Values.clusterSecretStore_parameter_store.role }}
      region: {{ .Values.aws.region }}
        jwt:
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore_parameter_store.serviceAccountRef.name }}
            namespace: {{ .Values.team }}-{{ .Values.environment }}
