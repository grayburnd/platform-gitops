apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.publicALBGateway.name }}
  namespace: {{ .Values.team }}-{{ .Values.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  gatewayClassName: {{ .Values.publicALBGateway.name }}
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: {{ .Values.publicALBGateway.name }}-config
      group: gateway.k8s.aws
  listeners: {{ .Values.publicALBGateway.listeners | toYamlPretty | nindent 4 }}