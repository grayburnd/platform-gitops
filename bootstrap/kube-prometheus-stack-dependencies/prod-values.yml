team: platform
environment: prod
labels:
  app: platform
  component: kube-prometheus-stack
  env: prod
  team: platform
aws:
  accountId: "AWS_ACCOUNT_ID_REDACTED"
  region: us-east-1
clusterSecretStore_secrets_manager:
  role: arn:aws:iam::AWS_ACCOUNT_ID_REDACTED:role/eso_operator-irsa-role
  service: SecretsManager
  serviceAccountRef:
    name: external-secrets-sa
clusterSecretStore_parameter_store:
  role: arn:aws:iam::AWS_ACCOUNT_ID_REDACTED:role/eso_operator-irsa-role
  service: ParameterStore
  serviceAccountRef:
    name: external-secrets-sa
grafanaExternalSecret:
  name: grafana-secret
  storeRef: prod-cluster-secret-store-secrets-manager ##Secret Store Ref to use