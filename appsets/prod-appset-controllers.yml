apiVersion: argoproj.io/v1alpha1 ##See if can take either helm 3rd party with own apps or just one of them. May need seperate appset.
kind: ApplicationSet
metadata:
  name: appset-controllers
  namespace: kube-system ##Only for Prod
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix: #Used to create seperate env for every app folder detected
        generators:
          - git:
              repoURL: https://github.com/grayburnd/platform-gitops.git
              revision: HEAD
              files:
                - path: controllers/*/prod-config.yml
          - list:
              elements:
                - env: prod
                  team: platform
                  cluster: https://kubernetes.default.svc

  template:      
    metadata:
      name: '{{ .app.Name }}-{{ .env }}'
    spec:
      # The project the application belongs to.
      project: '{{ .team }}'
      # Source of the application manifests
      sources:
        - repoURL: '{{ .thirdParty.repoURL }}'
          path: '{{ .thirdParty.path }}'
          targetRevision: '{{ .thirdParty.targetRevision }}' ##Check
          helm:
            valueFiles:
              - $values/{{ .team }}-gitops/{{ trimSuffix "/prod-config.yml" .path.path }}/{{ .env }}-values.yml
        - repoURL: '{{ .valuesRepoURL }}'
          targetRevision: HEAD
          ref: values
      
      # Destination cluster and namespace to deploy the application
      destination:
        server: '{{ .cluster }}'
        namespace: 'kube-system'

      # Sync policy
      syncPolicy:
        syncOptions:
          - ServerSideApply=true ##Useful for large resources i.e CRDs
  templatePatch: |
    {{- if .ignoreDifferences }}
    ignoreDifferences: {{ .ignoreDifferences | toYaml | nindent 6 }}
    {{- end }}
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
      