apiVersion: argoproj.io/v1alpha1 ##See if can take either helm 3rd party with own apps or just one of them. May need seperate appset.
kind: ApplicationSet
metadata:
  name: appset-third-party
  namespace: platform-prod ##Only for Prod
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix: #Used to create seperate env for every app folder detected
        generators:
          - git:
              repoURL: https://github.com/grayburnd/platform-gitops.git
              revision: HEAD
              files:
                - path: apps/third-party/*/prod-config.yml
          - list:
              elements:
                - env: prod
                  team: platform
                  cluster: https://kubernetes.default.svc

  template:      
    metadata:
      name: '{{ app.Name }}-{{ .env }}'
    spec:
      # The project the application belongs to.
      project: '{{ .team }}'
      # Source of the application manifests
      sources:
        - repoURL: '{{ .thirdParty.repoURL }}'
          path: '{{ .thirdParty.path }}'
          targetRevision: '{{ .thirdParty.targetRevision }}' ##Check
          helm:
            valueFiles:
              - $values/'{{ trimSuffix "/prod-config.yml" .path.path }}'/{{ .env }}-values.yml
        - repoURL: '{{ .repoURL }}'
          targetRevision: HEAD
          ref: values
      
      # Destination cluster and namespace to deploy the application
      destination:
        server: '{{ .cluster }}'
        namespace: '{{ .team }}-{{ .env }}'

      # Sync policy
      syncPolicy:
        syncOptions:
          - ServerSideApply=true ##Useful for large resources i.e CRDs
          - ApplyOutOfSyncOnly=true  
        automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: '{{ .prune }}' # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: '{{ .selfHeal }}' # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
      templatePatch: |
        {{- if .ignoreDifferences }}
        ignoreDifferences: {{ .ignoreDifferences | toYamlPretty | nindent 10 }}
        {{- end }}
      